<main class="access-page">
  <section class="access-card" aria-labelledby="access-title">
    <span class="access-card__code">403</span>
    <div class="access-card__icon" aria-hidden="true">!</div>
    <h1 id="access-title">Access denied</h1>
    <p>
      Your account is authenticated, but it does not have the permission required to open this page.
    </p>

    <div class="access-card__actions">
      <button type="button" class="msx-button msx-button--primary" (click)="goBack()">
        Go back
      </button>
      <button type="button" class="msx-button msx-button--secondary" (click)="goToAccount()">
        Account security
      </button>
      <button type="button" class="msx-button msx-button--ghost" (click)="signOut()">
        Sign out
      </button>
    </div>
  </section>
</main>
