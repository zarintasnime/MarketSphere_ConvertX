<app-page-header
  eyebrow="Procurement"
  [title]="id ? 'Edit purchase requisition' : 'New purchase requisition'"
  subtitle="Add at least one SKU and the required date."
  secondaryActionLabel="Back"
  (secondaryAction)="router.navigate(['/procurement/purchase-requisitions'])"
/>
@if (loading()) {
  <app-loading-panel message="Loading requisition..." />
} @else {
  @if (error()) {
    <div class="alert error">{{ error() }}</div>
  }
  <form class="form-card" [formGroup]="form" (ngSubmit)="save()">
    <div class="form-grid">
      <label>Requisition no.<input formControlName="purchaseRequisitionNo" /></label
      ><label
        >Branch<select formControlName="branchID">
          <option [ngValue]="0">Select branch</option>
          @for (item of branches(); track item.branchID) {
            <option [ngValue]="item.branchID">{{ item.branchName }}</option>
          }
        </select></label
      ><label
        >Requested by<select formControlName="requestedByEmployeeID">
          <option [ngValue]="0">Select employee</option>
          @for (item of employees(); track item.employeeID) {
            <option [ngValue]="item.employeeID">
              {{ item.employeeCode }} — {{ item.userFullName }}
            </option>
          }
        </select></label
      ><label>Required date<input type="date" formControlName="requiredDate" /></label
      ><label class="wide">Reason<textarea formControlName="reason"></textarea></label>
    </div>
    <section class="section-card" formArrayName="items">
      <div class="section-heading">
        <h2>Items</h2>
        <button type="button" class="secondary" (click)="addItem()">Add item</button>
      </div>
      @for (group of items.controls; track $index) {
        <div class="line-item" [formGroupName]="$index">
          <label
            >SKU<select formControlName="skuID">
              <option [ngValue]="0">Select SKU</option>
              @for (sku of skus(); track sku.skuID) {
                <option [ngValue]="sku.skuID">{{ sku.skuCode }} — {{ sku.skuName }}</option>
              }
            </select></label
          ><label
            >Quantity<input type="number" step="0.01" formControlName="requestedQuantity" /></label
          ><label
            >Estimated unit cost<input
              type="number"
              step="0.01"
              formControlName="estimatedUnitCost" /></label
          ><label>Note<input formControlName="note" /></label
          ><button type="button" class="link danger" (click)="removeItem($index)">Remove</button>
        </div>
      }
    </section>
    <div class="form-actions">
      <button type="submit" [disabled]="saving()">
        {{ saving() ? 'Saving...' : 'Save requisition' }}
      </button>
    </div>
  </form>
}
