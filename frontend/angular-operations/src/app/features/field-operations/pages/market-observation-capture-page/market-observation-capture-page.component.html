<section class="field-page">
  <div class="field-page__heading">
    <div>
      <h1>Market Observation</h1>
      <p>Capture availability, display, planogram, price, and competitor conditions.</p>
    </div>
  </div>
  @if (errorMessage()) {
    <p class="field-error">{{ errorMessage() }}</p>
  }
  @if (successMessage()) {
    <p class="field-success">{{ successMessage() }}</p>
  }
  <div class="field-card">
    <form class="field-grid" [formGroup]="form" (ngSubmit)="submit()">
      <div class="field-control">
        <label>Visit ID</label><input class="field-input" type="number" formControlName="visitID" />
      </div>
      <div class="field-control">
        <label>Client ID</label
        ><input class="field-input" type="number" formControlName="clientID" />
      </div>
      <div class="field-control">
        <label>Observation type</label
        ><select class="field-input" formControlName="observationType">
          @for (option of options; track option.value) {
            <option [ngValue]="option.value">{{ option.label }}</option>
          }
        </select>
      </div>
      <div class="field-control">
        <label>SKU ID</label><input class="field-input" type="number" formControlName="skuID" />
      </div>
      <div class="field-control">
        <label>Availability status</label
        ><input class="field-input" type="number" formControlName="availabilityStatus" />
      </div>
      <div class="field-control">
        <label>Facing count</label
        ><input class="field-input" type="number" formControlName="facingCount" />
      </div>
      <div class="field-control">
        <label>Planogram score</label
        ><input class="field-input" type="number" step="0.01" formControlName="planogramScore" />
      </div>
      <div class="field-control">
        <label>Display score</label
        ><input class="field-input" type="number" step="0.01" formControlName="displayScore" />
      </div>
      <div class="field-control">
        <label>Competitor brand</label
        ><input class="field-input" formControlName="competitorBrand" />
      </div>
      <div class="field-control">
        <label>Competitor product</label
        ><input class="field-input" formControlName="competitorProduct" />
      </div>
      <div class="field-control">
        <label>Competitor price</label
        ><input class="field-input" type="number" formControlName="competitorPrice" />
      </div>
      <div class="field-control">
        <label>Competitor offer</label
        ><input class="field-input" formControlName="competitorOffer" />
      </div>
      <div class="field-control" style="grid-column: 1/-1">
        <label>Note</label><textarea class="field-input" rows="4" formControlName="note"></textarea>
      </div>
      <button class="field-button" style="grid-column: 1/-1" type="submit" [disabled]="saving()">
        {{ saving() ? 'Submitting...' : 'Submit observation' }}
      </button>
    </form>
  </div>
</section>
