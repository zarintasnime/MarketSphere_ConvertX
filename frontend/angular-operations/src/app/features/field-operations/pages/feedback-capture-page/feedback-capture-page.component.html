<section class="field-page">
  <div class="field-page__heading">
    <div>
      <h1>Capture Feedback</h1>
      <p>Record customer, product, service, or campaign feedback.</p>
    </div>
  </div>
  @if (errorMessage()) {
    <p class="field-error">{{ errorMessage() }}</p>
  }
  @if (successMessage()) {
    <p class="field-success">{{ successMessage() }}</p>
  }
  <div class="field-card">
    <form class="field-grid" [formGroup]="form" (ngSubmit)="submit()">
      <div class="field-control">
        <label>Client ID</label
        ><input class="field-input" type="number" formControlName="clientID" />
      </div>
      <div class="field-control">
        <label>Visit ID</label><input class="field-input" type="number" formControlName="visitID" />
      </div>
      <div class="field-control">
        <label>Campaign ID</label
        ><input class="field-input" type="number" formControlName="campaignID" />
      </div>
      <div class="field-control">
        <label>Lead ID</label><input class="field-input" type="number" formControlName="leadID" />
      </div>
      <div class="field-control">
        <label>Feedback type</label
        ><select class="field-input" formControlName="feedbackType">
          @for (option of options; track option.value) {
            <option [ngValue]="option.value">{{ option.label }}</option>
          }
        </select>
      </div>
      <div class="field-control">
        <label>Rating</label
        ><input class="field-input" type="number" min="1" max="5" formControlName="rating" />
      </div>
      <div class="field-control" style="grid-column: 1/-1">
        <label>Comments</label
        ><textarea class="field-input" rows="5" formControlName="comments"></textarea>
      </div>
      <label style="grid-column: 1/-1"
        ><input type="checkbox" formControlName="isFollowUpRequired" /> Follow-up is required</label
      ><button class="field-button" style="grid-column: 1/-1" type="submit" [disabled]="saving()">
        {{ saving() ? 'Submitting...' : 'Submit feedback' }}
      </button>
    </form>
  </div>
</section>
