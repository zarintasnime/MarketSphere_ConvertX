name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore backend/MarketSphereConvertX.sln
      - name: Build
        run: dotnet build backend/MarketSphereConvertX.sln --configuration Release --no-restore

  angular-operations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/angular-operations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/angular-operations/package-lock.json
      - run: npm ci
      - run: npm run build

  react-management:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/react-management
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/react-management/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
